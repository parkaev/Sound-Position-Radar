name: build-and-release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/SoundRadar.Core.Tests/SoundRadar.Core.Tests.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/SoundRadar.App/SoundRadar.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Rename exe
        shell: pwsh
        run: Copy-Item "publish/SoundRadar.exe" "publish/Sound Radar.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundRadar-win-x64
          path: "publish/Sound Radar.exe"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish src/SoundRadar.App/SoundRadar.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Rename exe
        shell: pwsh
        run: Copy-Item "publish/SoundRadar.exe" "publish/Sound Radar.exe"

      # GitHub заменяет пробелы на точки в именах ассетов, поэтому exe с пробелом
      # в имени кладём внутрь zip — там имя файла сохраняется как есть.
      - name: Pack zip
        shell: pwsh
        run: Compress-Archive -Path "publish/Sound Radar.exe" -DestinationPath "publish/Sound Radar.zip" -Force

      - name: Attach exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Sound Radar.exe
            publish/Sound Radar.zip
          generate_release_notes: true
